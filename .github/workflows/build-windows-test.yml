name: build-windows-test

# Manual test build for the Windows pipeline: validates npm ci (node 16),
# the electron-gyp steps and the MSI packaging. Deliberately UNSIGNED:
# DigiCert KeyLocker signatures are billed, so they only run during a real
# release tag. Publishes NOWHERE by construction (--publish=never).

on:
    workflow_dispatch:

jobs:
    build-windows-unsigned-test:
        runs-on: windows-2022
        steps:
            - name: test/checkout-repo
              uses: actions/checkout@v3

            - name: test/setup-node
              uses: actions/setup-node@v3
              with:
                  node-version: "16.20.2"
                  registry-url: "https://npm.pkg.github.com"
                  scope: "@infomaniak"

            - name: test/install-deps
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
                  # The committed .npmrc expands ${NPM_TOKEN} (not NODE_AUTH_TOKEN).
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
              shell: powershell
              run: |
                  ./scripts/Makefile.ps1 install-deps
                  choco install yq --version 4.15.1 -y
                  npm i -g node-gyp
                  node-gyp install
                  node-gyp install --devdir="C:\Users\runneradmin\.electron-gyp" --target=$(jq -r .devDependencies.electron package.json) --dist-url="https://electronjs.org/headers"
                  node-gyp install --devdir="C:\Users\runneradmin\.electron-gyp" --target=$(jq -r .devDependencies.electron package.json) --dist-url="https://electronjs.org/headers" --arch arm64
                  node-gyp install --devdir="C:\Users\runneradmin\.electron-gyp" --target=$(jq -r .devDependencies.electron package.json) --dist-url="https://electronjs.org/headers" --arch ia32
                  npm ci

            - name: test/set-version
              run: npm --no-git-tag-version version 2.0.2-beta.2

            # Unsigned on purpose: a generated test config strips the DigiCert
            # KeyLocker sign hook and the certificate subject (billed per
            # signature). Real signatures only run during a release tag.
            - name: test/build-unsigned
              run: |
                  npm run build
                  node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('electron-builder.json','utf8'));delete c.win.sign;delete c.win.certificateSubjectName;fs.writeFileSync('electron-builder.test.json',JSON.stringify(c))"
                  npx electron-builder --config electron-builder.test.json --win msi --x64 --arm64 --publish=never

            - name: test/package
              run: |
                mkdir -p ./release/win-release
                bash -x ./scripts/cp_artifacts.sh dist ./release/win-release

            - name: test/upload-artifact
              uses: actions/upload-artifact@v4
              with:
                name: kmeet-windows-unsigned-test
                path: ./release
                compression-level: 0
                retention-days: 7
