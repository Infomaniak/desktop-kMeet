stages:
  - check

internal-urls:
  # Pins an image that ships git: a bare default image may not, and a missing
  # git must fail loudly, never read as "no match".
  image: node:24
  stage: check
  script:
    # Guard for the public mirror: no internal Infomaniak host in tracked
    # files. The host names are split so this file never matches itself.
    - |
      root='infomaniak'
      pattern="([a-z0-9-]+\.)+dev\.${root}\.ch|gitlab\.${root}\.ch"
      git grep -InE "$pattern" || code=$?
      if [ "${code:-0}" -eq 0 ]; then
        echo "⛔ Internal Infomaniak URLs found in tracked files - move them to build env or CI secrets (see .env.kmeet.example)."
        exit 1
      elif [ "${code:-0}" -gt 1 ]; then
        echo "git grep failed (exit ${code}) — treating as failure, not as no-match"
        exit "${code}"
      fi
      echo "OK: no internal Infomaniak URL in tracked files."

# @jitsi/robotjs (transitive dependency of @infomaniak/jitsi-meet-electron-sdk)
# compiles against X11 at install time; the bare node image lacks the headers.
.native-deps:
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends build-essential libx11-dev libxtst-dev libxext-dev libxinerama-dev libxrandr-dev

lint:
  extends: .native-deps
  image: node:24
  stage: check
  script:
    - npm ci
    - npm run lint

type-check:
  extends: .native-deps
  image: node:24
  stage: check
  script:
    - npm ci
    - npm run type-check
